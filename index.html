<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#123f36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NEPAL WORLD 3D</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="pill">🇳🇵 बागेश्वरी मन्दिर</div>
      <div class="pill" id="stats">Quest: ०/१</div>
    </div>

    <div id="hint">तीर बटन थिचेर हिँड्नुहोस्। मन्दिर वा बोट नजिक पुगेर E थिच्नुहोस्।</div>

    <div id="controls">
      <div id="pad">
        <div></div><button class="ctrl" data-dir="up">▲</button><div></div>
        <button class="ctrl" data-dir="left">◀</button><button class="ctrl" data-dir="down">▼</button><button class="ctrl" data-dir="right">▶</button>
      </div>
      <button id="reset">फेरि सुरु</button>
    </div>

    <div id="joystick" aria-label="mobile joystick">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>

    <div id="questBanner">Quest Complete</div>

    <div id="modal">
      <div id="panel">
        <h2 id="mtitle">स्वागत छ!</h2>
        <p id="mtext"></p>
        <button id="close">ठीक छ</button>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
