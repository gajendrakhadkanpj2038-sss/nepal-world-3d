<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>NEPAL WORLD 3D</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      color: white;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(#9adcf0, #dff4f0 42%, #7cbf5a 43%, #366d3d 100%);
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 40;
    }

    .pill {
      background: rgba(16, 44, 39, 0.86);
      color: white;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    #hint {
      position: fixed;
      left: 50%;
      top: 68px;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(255,255,255,0.92);
      color: #17352d;
      padding: 9px 14px;
      border-radius: 14px;
      font-size: 13px;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    #controls {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 30;
    }

    #pad {
      display: grid;
      grid-template-columns: 48px 48px 48px;
      grid-template-rows: 48px 48px;
      gap: 5px;
      pointer-events: auto;
    }

    .ctrl {
      border: 1px solid rgba(255,255,255,.7);
      background: rgba(22,59,54,.85);
      color: #fff;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      touch-action: none;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }

    #reset {
      pointer-events: auto;
      border: 0;
      border-radius: 15px;
      padding: 12px 15px;
      background: white;
      color: #17352d;
      font-weight: 800;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    #modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      z-index: 50;
    }

    #panel {
      background: white;
      color: #17352d;
      max-width: 380px;
      width: 100%;
      padding: 22px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    #panel h2 { margin: 0 0 8px; }
    #panel p { line-height: 1.6; }
    #close {
      border: 0;
      background: #1c6655;
      color: white;
      border-radius: 12px;
      padding: 11px 22px;
      font-weight: 700;
    }

    #questBanner {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: linear-gradient(135deg, #f6ffb8, #fff7d1, #ffd8a8);
      color: #153d39;
      font-weight: 900;
      letter-spacing: 0.08em;
      border-radius: 20px;
      padding: 22px 34px;
      font-size: clamp(1.2rem, 2.6vw, 2.4rem);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      border: 2px solid rgba(11,37,31,.18);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s ease;
      z-index: 60;
    }

    #questBanner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #questBanner.hide {
      opacity: 0;
    }

    #joystick {
      position: fixed;
      left: 18px;
      bottom: 22px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: none;
      pointer-events: auto;
      touch-action: none;
      z-index: 35;
    }

    #joystick-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 2px solid rgba(255,255,255,.25);
      box-shadow: inset 0 0 25px rgba(255,255,255,.12);
    }

    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      transform: translate(-50%,-50%);
      background: linear-gradient(#fff,#dce9ef);
      box-shadow: 0 6px 20px rgba(0,0,0,.22);
      border: 2px solid rgba(12,48,45,.25);
    }

    body.mobile #joystick { display: block; }
    body.mobile #pad { display: none; }
    body.mobile #controls { left: 0; right: 0; padding: 0 18px 18px; align-items: flex-end; }
    body.mobile #reset { margin-left: auto; }

    @media (max-width: 480px) {
      .pill { font-size: 11px; padding: 7px 10px; }
      #hint { font-size: 11px; padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="pill">🇳🇵 बागेश्वरी मन्दिर</div>
    <div class="pill" id="stats">Quest: ०/१</div>
  </div>

  <div id="hint">तीर बटन थिचेर हिँड्नुहोस्। मन्दिर वा बोट नजिक पुगेर E थिच्नुहोस्।</div>

  <div id="controls">
    <div id="pad">
      <div></div><button class="ctrl" data-dir="up">▲</button><div></div>
      <button class="ctrl" data-dir="left">◀</button><button class="ctrl" data-dir="down">▼</button><button class="ctrl" data-dir="right">▶</button>
    </div>
    <button id="reset">फेरि सुरु</button>
  </div>

  <div id="joystick" aria-label="mobile joystick">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <div id="questBanner">Quest Complete</div>

  <div id="modal">
    <div id="panel">
      <h2 id="mtitle">स्वागत छ!</h2>
      <p id="mtext"></p>
      <button id="close">ठीक छ</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

    const canvas = document.getElementById('game');
    const stats = document.getElementById('stats');
    const modal = document.getElementById('modal');
    const mtitle = document.getElementById('mtitle');
    const mtext = document.getElementById('mtext');
    const questBanner = document.getElementById('questBanner');
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ddaf2);
    scene.fog = new THREE.Fog(0x9ddaf2, 35, 100);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.9, 0.15);
    composer.addPass(bloomPass);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 5.5, 12);

    const clock = new THREE.Clock();

    const input = {
      forward: false,
      backward: false,
      left: false,
      right: false
    };

    const joystickState = { active: false, x: 0, y: 0 };

    const player = {
      position: new THREE.Vector3(0, 1.1, 12),
      direction: new THREE.Vector3(0, 0, -1),
      speed: 11,
      yaw: 0,
      mesh: null
    };

    const world = {
      templePos: new THREE.Vector3(0, 0, -14),
      treePos: new THREE.Vector3(-12, 0, 1),
      npcPos: new THREE.Vector3(0, 0, -9),
      boundary: 28,
      size: 100
    };

    let questStarted = false;
    let hasCoconut = false;
    let questComplete = false;

    function createGround() {
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(120, 120),
        new THREE.MeshStandardMaterial({ color: 0x6ea85a, roughness: 0.98, metalness: 0.02 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x8d7049, roughness: 1 });
      const road1 = new THREE.Mesh(new THREE.BoxGeometry(18, 0.12, 8), roadMaterial);
      road1.position.set(0, 0.06, 0);
      road1.receiveShadow = true;
      scene.add(road1);

      const road2 = new THREE.Mesh(new THREE.BoxGeometry(8, 0.12, 18), roadMaterial);
      road2.position.set(0, 0.06, -8);
      road2.receiveShadow = true;
      scene.add(road2);

      // fields
      for (let i = 0; i < 18; i++) {
        const patch = new THREE.Mesh(
          new THREE.BoxGeometry(4.2, 0.04, 2.2),
          new THREE.MeshStandardMaterial({ color: 0xd9eea6, roughness: 1 })
        );
        patch.position.set(-24 + i * 3, 0.07, 20 + (i % 3) * 2);
        patch.rotation.y = 0.18;
        patch.receiveShadow = true;
        scene.add(patch);
      }

      // little water pond
      const pond = new THREE.Mesh(
        new THREE.CircleGeometry(5.5, 32),
        new THREE.MeshPhysicalMaterial({
          color: 0x3f9cc9,
          roughness: 0.15,
          transmission: 0.2,
          transparent: true,
          opacity: 0.9
        })
      );
      pond.rotation.x = -Math.PI / 2;
      pond.position.set(20, 0.06, 18);
      scene.add(pond);
    }

    function createTemple() {
      const group = new THREE.Group();

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(12, 2.8, 8),
        new THREE.MeshStandardMaterial({ color: 0xd9b15d, roughness: 0.75 })
      );
      base.position.y = 1.4;
      base.castShadow = true;
      base.receiveShadow = true;
      group.add(base);

      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(7.8, 3.6, 4),
        new THREE.MeshStandardMaterial({ color: 0xb94d39, roughness: 0.7, metalness: 0.1 })
      );
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 4.8;
      roof.castShadow = true;
      group.add(roof);

      const inner = new THREE.Mesh(
        new THREE.BoxGeometry(6.6, 4.4, 4.6),
        new THREE.MeshStandardMaterial({ color: 0xf5e7c8, roughness: 0.8 })
      );
      inner.position.y = 3.0;
      group.add(inner);

      const topDome = new THREE.Mesh(
        new THREE.SphereGeometry(2.2, 24, 24),
        new THREE.MeshPhysicalMaterial({
          color: 0xf7d770,
          emissive: 0x2a1800,
          roughness: 0.5,
          metalness: 0.1
        })
      );
      topDome.position.y = 7.6;
      group.add(topDome);

      for (let i = 0; i < 4; i++) {
        const p = new THREE.Mesh(
          new THREE.CylinderGeometry(0.5, 0.5, 3.8, 12),
          new THREE.MeshStandardMaterial({ color: 0x8d6830, roughness: 0.9 })
        );
        const x = i < 2 ? -3.2 : 3.2;
        const z = i % 2 === 0 ? -2.7 : 2.7;
        p.position.set(x, 1.8, z);
        p.castShadow = true;
        group.add(p);
      }

      group.position.copy(world.templePos);
      scene.add(group);
    }

    function createTree(x, z, scale = 1) {
      const group = new THREE.Group();

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.7 * scale, 0.9 * scale, 5 * scale, 12),
        new THREE.MeshStandardMaterial({ color: 0x7a4d2b, roughness: 1 })
      );
      trunk.position.y = 2.5 * scale;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);

      const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e8f47, roughness: 1 });
      const leaf1 = new THREE.Mesh(new THREE.SphereGeometry(2.8 * scale, 20, 20), leavesMat);
      leaf1.position.set(0, 5.5 * scale, 0);
      leaf1.castShadow = true;
      group.add(leaf1);

      const leaf2 = new THREE.Mesh(new THREE.SphereGeometry(2.3 * scale, 20, 20), leavesMat);
      leaf2.position.set(1.4 * scale, 6.5 * scale, 0.5 * scale);
      leaf2.castShadow = true;
      group.add(leaf2);

      const leaf3 = new THREE.Mesh(new THREE.SphereGeometry(2.2 * scale, 20, 20), leavesMat);
      leaf3.position.set(-1.6 * scale, 6.2 * scale, -0.8 * scale);
      leaf3.castShadow = true;
      group.add(leaf3);

      group.position.set(x, 0, z);
      scene.add(group);
      return group;
    }

    function createNPC() {
      const group = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.8, 2.2, 8, 16),
        new THREE.MeshStandardMaterial({ color: 0x2d3e52, roughness: 0.8 })
      );
      body.position.y = 2.2;
      body.castShadow = true;
      group.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.7, 18, 18),
        new THREE.MeshStandardMaterial({ color: 0xf0c89a, roughness: 0.9 })
      );
      head.position.y = 4.1;
      head.castShadow = true;
      group.add(head);

      const robe = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 1.35, 0.75),
        new THREE.MeshStandardMaterial({ color: 0xb87f3e, roughness: 0.8 })
      );
      robe.position.y = 2.5;
      group.add(robe);

      const shoes = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.4, 0.8),
        new THREE.MeshStandardMaterial({ color: 0x1d1d1d })
      );
      shoes.position.set(0, 0.8, 0.2);
      group.add(shoes);

      group.position.copy(world.npcPos);
      scene.add(group);
      return group;
    }

    function createPlayerMesh() {
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.8, 2.2, 8, 16),
        new THREE.MeshStandardMaterial({ color: 0x2e5d9f, roughness: 0.7, metalness: 0.15 })
      );
      body.position.copy(player.position);
      body.castShadow = true;
      player.mesh = body;
      scene.add(body);
    }

    function createCoconut() {
      coconut.position.set(world.treePos.x, 7.2, world.treePos.z + 0.7);
      coconut.castShadow = true;
      coconut.material = new THREE.MeshStandardMaterial({
        color: 0x9a5b2d,
        roughness: 0.8,
        metalness: 0.1
      });
      scene.add(coconut);
    }

    function addLights() {
      const hemi = new THREE.HemisphereLight(0xe1f8ff, 0x4e7a44, 1.2);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xfff5d6, 1.4);
      sun.position.set(30, 32, 18);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -35;
      sun.shadow.camera.right = 35;
      sun.shadow.camera.top = 35;
      sun.shadow.camera.bottom = -35;
      scene.add(sun);

      const fill = new THREE.PointLight(0xfff3d0, 0.8, 60, 2);
      fill.position.set(-10, 12, -8);
      scene.add(fill);
    }

    function setQuestStatus() {
      stats.textContent = questComplete ? 'Quest: १/१' : 'Quest: ०/१';
    }

    function showModal(title, text) {
      mtitle.textContent = title;
      mtext.textContent = text;
      modal.style.display = 'flex';
    }

    function showBanner(text) {
      questBanner.textContent = text;
      questBanner.classList.remove('hide');
      questBanner.classList.add('show');
      clearTimeout(showBanner.timer);
      showBanner.timer = setTimeout(() => {
        questBanner.classList.remove('show');
        questBanner.classList.add('hide');
      }, 1800);
    }

    function distance2D(a, b) {
      return Math.hypot(a.x - b.x, a.z - b.z);
    }

    function action() {
      const distToNpc = distance2D(player.position, world.npcPos);
      const distToTree = distance2D(player.position, world.treePos);

      if (distToNpc < 3.5) {
        if (!questStarted) {
          questStarted = true;
          showModal('पजारी', 'नमस्कार! बागेश्वरी मन्दिरको लागि एउटा ताजा नारिकेल ल्याउनुहोस्। बाहिरको बोटमा चढ़ेर नारिकेल उठाउनुहोस्।');
          return;
        }

        if (hasCoconut && !questComplete) {
          questComplete = true;
          showBanner('Quest Complete');
          showModal('पजारी', 'धन्यवाद! तपाईंले नारिकेल ल्याए। मन्दिरको आशीर्वाद तपाईंको लागि छ।');
          setQuestStatus();
          return;
        }

        if (!hasCoconut) {
          showModal('पजारी', 'तपाईंले अझै नारिकेल ल्याउनु भएको छैन। बाहिरको बोटमा चढ़ेर नारिकेल उठाउनुहोस्।');
          return;
        }
      }

      if (distToTree < 4.5) {
        if (!hasCoconut) {
          hasCoconut = true;
          coconut.visible = false;
          showModal('बोट', 'तपाईंले एक ताजा नारिकेल उठाउनुभयो। अब पजारीलाई ल्याउनुहोस्।');
          return;
        }
        showModal('बोट', 'तपाईंले पहिले नै नारिकेल लिएर जानुभएको छ। पजारीलाई पुर्याउनुहोस्।');
        return;
      }

      const distToTemple = distance2D(player.position, world.templePos);
      if (distToTemple < 5) {
        showModal('बागेश्वरी मन्दिर', 'मन्दिरको शान्ति र पजारीलाई भेट्नुहोस्।');
      } else {
        showModal('मन्दिरको बाहिर', 'बागेश्वरी मन्दिरमा जानुहोस्। बोटमा चढ़ेर नारिकेल उठाउनुहोस्।');
      }
    }

    function resetGame() {
      player.position.set(0, 1.1, 12);
      player.yaw = 0;
      questStarted = false;
      hasCoconut = false;
      questComplete = false;
      coconut.visible = true;
      setQuestStatus();
    }

    function setupControls() {
      document.querySelectorAll('[data-dir]').forEach((button) => {
        const dir = button.dataset.dir;
        const setDir = (down) => {
          if (dir === 'up') input.forward = down;
          if (dir === 'down') input.backward = down;
          if (dir === 'left') input.left = down;
          if (dir === 'right') input.right = down;
        };

        button.addEventListener('pointerdown', (e) => { e.preventDefault(); setDir(true); });
        ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => {
          button.addEventListener(ev, () => setDir(false));
        });
      });

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();

        if (k === 'e') {
          action();
          e.preventDefault();
          return;
        }

        if (k === 'w' || k === 'arrowup') input.forward = true;
        if (k === 's' || k === 'arrowdown') input.backward = true;
        if (k === 'a' || k === 'arrowleft') input.left = true;
        if (k === 'd' || k === 'arrowright') input.right = true;

        if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
          e.preventDefault();
        }
      });

      window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'w' || k === 'arrowup') input.forward = false;
        if (k === 's' || k === 'arrowdown') input.backward = false;
        if (k === 'a' || k === 'arrowleft') input.left = false;
        if (k === 'd' || k === 'arrowright') input.right = false;
      });

      document.getElementById('reset').addEventListener('click', resetGame);
      document.getElementById('close').addEventListener('click', () => { modal.style.display = 'none'; });

      joystickBase.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        joystickState.active = true;
        joystickBase.setPointerCapture(e.pointerId);
        updateJoystick(e.clientX, e.clientY);
      });

      joystickBase.addEventListener('pointermove', (e) => {
        if (!joystickState.active) return;
        updateJoystick(e.clientX, e.clientY);
      });

      ['pointerup', 'pointercancel', 'pointerleave'].forEach((eventName) => {
        joystickBase.addEventListener(eventName, () => {
          joystickState.active = false;
          joystickState.x = 0;
          joystickState.y = 0;
          joystickKnob.style.transform = 'translate(-50%,-50%)';
        });
      });
    }

    function updateJoystick(clientX, clientY) {
      const rect = joystickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      let dx = clientX - cx;
      let dy = clientY - cy;
      const max = rect.width * 0.34;
      const dist = Math.hypot(dx, dy);
      const scale = dist > max ? max / dist : 1;

      dx *= scale;
      dy *= scale;

      joystickState.x = dx / max;
      joystickState.y = dy / max;
      joystickKnob.style.transform = `translate(${dx}px,${dy}px)`;
    }

    function updatePlayer(delta) {
      let moveX = 0;
      let moveZ = 0;

      if (input.forward) moveZ -= 1;
      if (input.backward) moveZ += 1;
      if (input.left) moveX -= 1;
      if (input.right) moveX += 1;

      if (joystickState.active) {
        moveX += joystickState.x;
        moveZ += joystickState.y;
      }

      const len = Math.hypot(moveX, moveZ);
      if (len > 0) {
        moveX /= len;
        moveZ /= len;
      }

      player.position.x += moveX * player.speed * delta;
      player.position.z += moveZ * player.speed * delta;

      player.position.x = THREE.MathUtils.clamp(player.position.x, -world.boundary, world.boundary);
      player.position.z = THREE.MathUtils.clamp(player.position.z, -world.boundary, world.boundary);

      if (len > 0.01) {
        player.direction.set(moveX, 0, moveZ).normalize();
        player.yaw = Math.atan2(player.direction.x, player.direction.z) + Math.PI;
      }

      player.mesh.position.copy(player.position);
      player.mesh.rotation.y = player.yaw;
    }

    function updateCamera() {
      const offset = new THREE.Vector3(
        Math.sin(player.yaw) * 8.5,
        4.8,
        Math.cos(player.yaw) * 8.5
      );

      const desiredPos = player.position.clone().add(offset);
      camera.position.lerp(desiredPos, 0.08);

      const lookTarget = player.position.clone().add(new THREE.Vector3(0, 2.0, 0));
      camera.lookAt(lookTarget);
    }

    function init() {
      createGround();
      createTemple();
      createTree(world.treePos.x, world.treePos.z, 1.15);
      createNPC();
      createPlayerMesh();
      createCoconut();
      addLights();
      setQuestStatus();

      const isMobileDevice = window.matchMedia('(pointer: coarse)').matches || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobileDevice) document.body.classList.add('mobile');

      setupControls();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(bloomPass);
    }

    function animate() {
      const delta = clock.getDelta();
      updatePlayer(delta);
      updateCamera();
      composer.render();
      requestAnimationFrame(animate);
    }

    init();
    animate();
  </script>
</body>
</html>
